central:
  base_url: "https://ai-compare-server.tec-do.cn/"
  # login: 自动登录并在 Cookie 失效时重新登录；bearer: 使用固定 API Token；auto: 优先登录。
  auth_mode: "login"
  username_env: "AI_COMPARE_PANEL_USERNAME"
  password_env: "AI_COMPARE_PANEL_PASSWORD"
  # 仅 auth_mode=bearer 时使用。
  token_env: "AI_COMPARE_PANEL_TOKEN"
  request_timeout_seconds: 15

watchdog:
  poll_seconds: 300
  stale_minutes: 30
  verify_wait_seconds: 120
  restart_cooldown_minutes: 60
  max_restarts_per_cycle: 1
  max_cpu_percent: 90
  max_memory_percent: 90
  min_available_memory_mb: 2048
  browser_stop_delay_seconds: 8

browsers:
  bitbrowser:
    enabled: true
    base_url: "http://127.0.0.1:54345"
    request_timeout_seconds: 30
    load_extensions: true
  donut:
    enabled: false
    mode: "uia"  # uia | rest | auto
    # 下面两项只在 rest 模式使用；uia 模式不需要 DONUT_API_KEY。
    base_url: "http://127.0.0.1:10108"
    token_env: "DONUT_API_KEY"
    request_timeout_seconds: 30
    window_title: "Donut Browser"

# --discover 可自动生成候选映射；自动重启前请人工核对。
instances:
  - browser_name: "AU-DT-HK3-17"
    browser_type: "bitbrowser"
    profile_id: "replace-with-real-profile-id"
    auto_restart: true
    priority: 10
