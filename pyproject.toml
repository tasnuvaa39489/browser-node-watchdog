[project]
name = "browser-node-watchdog"
version = "0.1.0"
description = "Local watchdog for ai-compare BitBrowser and Donut Browser nodes"
requires-python = ">=3.11"
dependencies = [
    "psutil>=6.0.0",
    "pyyaml>=6.0.0",
    "requests>=2.32.0",
    "pywinauto>=0.6.9; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
